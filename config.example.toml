[plugin]
enabled = false
config_version = "0.4.1"

[general]
timeout = 120
max_text_length = 500
max_total_length = 2000
max_segments = 8

[output]
# text_and_voice：文字和语音同批发送；text_then_voice：文字先发，成功后后台补语音；voice_only：本轮只发送语音
mode = "text_and_voice"

[voice]
voice_dir = ""
preferred_reference_file = ""
reference_strategy = "best_single"
clone_prompt = "用原本的音色和语气说话，保持自然流畅"
sample_rate = 24000
max_clip_duration = 15.0
ffmpeg_path = ""

[mimo]
api_key = ""
api_base_url = "https://api.xiaomimimo.com/v1"
synthesis_mode = "voiceclone"
model = "mimo-v2.5-tts-voiceclone"
preset_voice = "冰糖"
audio_format = "mp3"

[command]
allowed_user_ids = []
